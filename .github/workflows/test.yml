name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Shell syntax
        run: bash -n install.sh && bash -n uninstall.sh

      # The Mac app bundle has not been exercised on a physical Mac in this repo.
      # This installs browser mode on the GitHub macOS runner and checks the bundle starts.
      - name: macOS install smoke
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ./install.sh --browser
          D="$HOME/.local/share/chatbox"
          test -x "$D/run.sh"
          test -f "$D/chatbox.py"
          test -f "$D/ui/index.html"
          test -f "$D/ui/js/app.js"
          test -f "$D/chatgpt.py"
          test -f "$D/attachments.py"
          test -f "$D/update.py"
          test -f "$D/install.json"
          python3 -c 'import json,os,sys; d=json.load(open(os.path.join(sys.argv[1],"install.json"))); assert d["mode"]=="browser" and d["source"]' "$D"
          APP=""
          if [ -d /Applications/Chatbox.app ]; then APP=/Applications/Chatbox.app; fi
          if [ -d "$HOME/Applications/Chatbox.app" ]; then APP="$HOME/Applications/Chatbox.app"; fi
          test -n "$APP"
          test -x "$APP/Contents/MacOS/Chatbox"
          test -f "$APP/Contents/Info.plist"
          # chatbox.py reads CHATBOX_DATA at import. Keep this smoke server's data out of the install dir.
          DATA="$(mktemp -d)"
          CHATBOX_DATA="$DATA" python3 "$D/chatbox.py" --no-browser --port 8765 >"$DATA/server.log" 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          # About 30s. A short loop raced the process on the macOS runner (connection
          # refused once, then the step died). Poll /api/status, and never pipe curl
          # into grep -q: under pipefail, grep closing the pipe makes curl exit 23.
          ready=0
          i=0
          while [ "$i" -lt 60 ]; do
            i=$((i + 1))
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "server exited before it was ready" >&2
              cat "$DATA/server.log" >&2 || true
              exit 1
            fi
            code="$(curl -sS --max-time 2 -o "$DATA/status.json" -w "%{http_code}" "http://127.0.0.1:8765/api/status" || true)"
            if [ "$code" = "200" ] && grep -F -q '"home"' "$DATA/status.json"; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" != 1 ]; then
            echo "server did not answer /api/status" >&2
            cat "$DATA/server.log" >&2 || true
            exit 1
          fi
          curl -fsS --max-time 10 -o "$DATA/index.html" "http://127.0.0.1:8765/"
          curl -fsS --max-time 10 -o "$DATA/style.css" "http://127.0.0.1:8765/ui/style.css"
          grep -F -q "ui/js/app.js" "$DATA/index.html"
          grep -F -q -- "--bg" "$DATA/style.css"
